<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한달근태 조회 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    :root { --primary-color: #006670; --secondary-color: #008489; --accent-color: #e6f7f8; --text-color: #2c3e50; --input-border: #cbd5e1; --white: #ffffff; --danger-color: #e74c3c; --blue-color: #3498db; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; background-image: url('https://newsx.ecn.cdn.infralab.net/www.whosaeng.com/imgdata/whosaeng_com/202211/2022112932303587.jpg'); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text-color); display: flex; justify-content: center; align-items: center; }
    .app-container { width: 100%; max-width: 420px; height: 95vh; margin: 10px; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); overflow-y: auto; padding: 30px 25px; box-sizing: border-box; position: relative; }
    
    .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
    .form-header h2 { color: var(--primary-color); margin: 0; font-size: 20px; text-align: center; flex: 1; }
    .top-back-text { background: none; border: none; font-size: 22px; color: #64748b; cursor: pointer; padding: 0 10px 0 0; transition: 0.2s; font-weight: 900; }
    
    .form-group { margin-bottom: 20px; }
    input[type="text"], select { width: 100%; padding: 14px; border: 1.5px solid var(--input-border); border-radius: 10px; box-sizing: border-box; font-size: 15px; font-family: inherit; background-color: #f8fafc; transition: all 0.2s; color: #0f172a; }
    input:focus, select:focus { outline: none; border-color: var(--secondary-color); background-color: var(--white); box-shadow: 0 0 0 4px rgba(0, 132, 137, 0.1); }
    
    .submit-btn { width: 100%; padding: 16px; background-color: var(--primary-color); color: var(--white); border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(0, 102, 112, 0.2); }
    .submit-btn:hover { background-color: #004d55; transform: translateY(-2px); }

    .workplace-group { display: flex; gap: 8px; margin-bottom: 15px; }
    .wp-btn-sch { flex: 1; padding: 12px 0; text-align: center; background-color: #e2e8f0; color: #64748b; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .wp-btn-sch.active { background-color: var(--primary-color); color: var(--white); box-shadow: 0 4px 10px rgba(0, 102, 112, 0.2); }

    .month-select { width: 100%; padding: 14px; border: 1.5px solid var(--primary-color); border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 10px; background-color: #e6f7f8; color: var(--primary-color); font-weight: 800; cursor: pointer; outline: none; }
    
    .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); z-index: 300; display: none; justify-content: center; align-items: center; flex-direction: column; border-radius: 24px; }
    .spinner { border: 4px solid #e2e8f0; width: 45px; height: 45px; border-radius: 50%; border-left-color: var(--primary-color); animation: spin 1s infinite; margin-bottom: 15px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .capture-area { background: var(--white); padding: 30px 20px 25px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .day-cell { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; height: 50px; position: relative; display: flex; align-items: center; justify-content: center; }
    .day-num { position: absolute; top: 4px; left: 5px; font-size: 10px; color: #000000; font-weight: 800; }
    .day-num.weekday { color: #000000; }
    .day-num.sat { color: var(--blue-color); }
    .day-num.sun { color: var(--danger-color); }
    .day-code { font-size: 14px; font-weight: 800; }
    .text-red { color: var(--danger-color); }
    .text-blue { color: var(--primary-color); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p style="color: #006670; font-weight: 700;">조회 중입니다...</p></div>

    <div class="form-header">
      <button type="button" class="top-back-text" onclick="history.back()">❮</button>
      <h2>📅 한달근태 조회</h2>
      <div style="width:22px;"></div>
    </div>

    <div class="workplace-group">
      <button type="button" class="wp-btn-sch active" onclick="selectWorkplace('본관', this)">본관</button>
      <button type="button" class="wp-btn-sch" onclick="selectWorkplace('전문병원', this)">전문병원</button>
      <button type="button" class="wp-btn-sch" onclick="selectWorkplace('암병원', this)">암병원</button>
    </div>
    <input type="hidden" id="selectedWorkplace" value="본관">
    
    <div class="form-group">
      <select id="targetMonth" class="month-select">
        <option value="26.01">2026년 01월</option><option value="26.02">2026년 02월</option>
        <option value="26.03">2026년 03월</option><option value="26.04">2026년 04월</option>
        <option value="26.05">2026년 05월</option><option value="26.06">2026년 06월</option>
        <option value="26.07">2026년 07월</option><option value="26.08">2026년 08월</option>
        <option value="26.09">2026년 09월</option><option value="26.10">2026년 10월</option>
        <option value="26.11">2026년 11월</option><option value="26.12">2026년 12월</option>
      </select>
    </div>
    
    <div class="form-group">
      <input type="text" id="workerNameScan" placeholder="이름을 입력하세요" autocomplete="off">
    </div>
    
    <button class="submit-btn" onclick="fetchSchedule()">근무 스케줄 조회하기</button>
    
    <div id="calendarResultArea" style="display:none; margin-top:20px;">
      <div id="captureArea" class="capture-area">
        <div id="calMonthTitle" style="text-align:center; font-weight:bold; font-size:22px; color:#006670;"></div>
        <div id="calWelcomeMsg" style="text-align:center; color:#64748b; font-size:15px; font-weight:600; margin-bottom:20px; padding-bottom:15px; border-bottom:1px dashed #e2e8f0;"></div>
        <div id="calendarGrid" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; margin-top:15px; text-align:center;"></div>
      </div>
      <button class="save-img-btn" onclick="saveCalImage()" style="margin-top: 15px; background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; width: fit-content; margin-left: auto; margin-right: auto;">📸 사진첩 저장</button>
    </div>
  </div>

  <script>
    // ★ 이 주소는 기존 메인 앱스 스크립트 주소여야 합니다. (이전과 동일하게 유지) ★
    const GET_URL = 'https://script.google.com/macros/s/AKfycbweiuyShrgfLtl9eTXVIyGlsHyiZXk8HICMyqGxsg0jAGa6MKinVCxJcgbiIx39ucka4Q/exec';

    window.addEventListener('load', () => {
      const now = new Date();
      document.getElementById('targetMonth').value = "26." + String(now.getMonth()+1).padStart(2,'0');
    });

    function selectWorkplace(wp, btnElement) { 
      document.getElementById('selectedWorkplace').value = wp; 
      const btns = document.querySelectorAll('.wp-btn-sch'); 
      btns.forEach(btn => btn.classList.remove('active')); 
      btnElement.classList.add('active');
    }

    function fetchSchedule() { 
      const name = document.getElementById('workerNameScan').value.trim(); 
      const sheetName = document.getElementById('targetMonth').value; 
      const workplace = document.getElementById('selectedWorkplace').value; 
      
      if (!name) { alert('이름을 입력해주세요.'); return; } 
      
      document.getElementById('loadingOverlay').style.display = 'flex'; 
      document.getElementById('calendarResultArea').style.display = 'none'; 
      
      fetch(`${GET_URL}?name=${encodeURIComponent(name)}&sheetName=${encodeURIComponent(sheetName)}&workplace=${encodeURIComponent(workplace)}&t=${Date.now()}`)
      .then(res => res.json())
      .then(data => { 
        if (data.result === 'success') { drawCalendar(name, data.year, data.month, data.schedule); } 
        else { alert(data.message); } 
      })
      .catch(() => alert('조회 실패: 네트워크 상태를 확인해주세요.'))
      .finally(() => document.getElementById('loadingOverlay').style.display = 'none'); 
    }
    
    function drawCalendar(name, year, month, scheduleData) { 
      const holidays = ['01-01', '02-16', '02-17', '02-18', '03-01', '03-02', '05-05', '05-24', '05-25', '06-03', '06-06', '08-15', '08-17', '09-24', '09-25', '09-26', '10-03', '10-05', '10-09', '12-25']; 
      const standardCodes = ['D4', 'A1', 'A2', 'C1', 'C2', 'B1', 'B2']; 
      
      document.getElementById('calMonthTitle').innerText = `${month}월 스케줄표`; 
      document.getElementById('calWelcomeMsg').innerHTML = `${name} 근무표입니다.`; 
      
      let daysInMonth = new Date(year, month, 0).getDate(); 
      let firstDay = new Date(year, month - 1, 1).getDay(); 
      
      let gridHtml = `<div style="text-align:center; color:var(--danger-color); font-weight:900;">일</div><div style="text-align:center; font-weight:900;">월</div><div style="text-align:center; font-weight:900;">화</div><div style="text-align:center; font-weight:900;">수</div><div style="text-align:center; font-weight:900;">목</div><div style="text-align:center; font-weight:900;">금</div><div style="text-align:center; color:var(--blue-color); font-weight:900;">토</div>`; 
      
      for (let i = 0; i < firstDay; i++) { 
        gridHtml += `<div class="day-cell" style="background:transparent; border:none;"></div>`; 
      } 
      
      for (let i = 0; i < daysInMonth; i++) { 
        let code = scheduleData[i] || ''; 
        let upperCode = code.toUpperCase(); 
        let dObj = new Date(year, month - 1, i + 1); 
        let dOfWeek = dObj.getDay(); 
        let dKey = `${String(month).padStart(2, '0')}-${String(i + 1).padStart(2, '0')}`; 
        let nCls = (dOfWeek === 0 || holidays.includes(dKey)) ? 'sun' : (dOfWeek === 6 ? 'sat' : 'weekday'); 
        let cCls = code !== '' ? (standardCodes.includes(upperCode) ? 'text-blue' : 'text-red') : ''; 
        gridHtml += `<div class="day-cell"><div class="day-num ${nCls}">${i + 1}</div><div class="day-code ${cCls}">${code}</div></div>`; 
      } 
      
      document.getElementById('calendarGrid').innerHTML = gridHtml; 
      document.getElementById('calendarResultArea').style.display = 'block'; 
    }
    
    async function saveCalImage() { 
      const captureDiv = document.getElementById('captureArea'); 
      const name = document.getElementById('workerNameScan').value.trim(); 
      const month = document.getElementById('targetMonth').value.split('.')[1]; 
      try { 
        const canvas = await html2canvas(captureDiv, { scale: 2, backgroundColor: '#ffffff' }); 
        const link = document.createElement('a'); 
        link.download = `${name}_${month}월_스케줄.png`; 
        link.href = canvas.toDataURL('image/png'); 
        link.click(); 
      } catch (e) { alert('저장 실패'); } 
    }
  </script>
</body>
</html>
